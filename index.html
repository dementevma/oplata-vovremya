<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Оплата вовремя — помощник для бизнеса: находит, почему клиент не платит, и что сделать, чтобы получить деньги.">
  <title>Оплата вовремя</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="web/css/app.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/today" aria-label="Оплата вовремя, главная">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="3.2"/><path d="M16 9v7l5 3.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span>
      <span>Оплата вовремя</span>
    </a>
    <span class="company" id="company"></span>
    <div class="top-actions">
      <span class="asof">на <b id="asof"></b></span>
      <button class="btn" id="import-btn">Загрузить данные</button>
      <button class="icon-btn" id="reset-btn" title="Вернуть демонстрационные данные" aria-label="Вернуть демонстрационные данные">↺</button>
    </div>
  </div>
  <div class="wrap">
    <nav class="tabs" aria-label="Разделы" id="nav">
      <a href="#/today" data-view="today">Сегодня</a>
      <a href="#/message" data-view="message">Письмо</a>
      <a href="#/docs" data-view="docs">Документ</a>
      <a href="#/invoices" data-view="invoices">Счета <b id="nav-late"></b></a>
      <a href="#/reconcile" data-view="reconcile">Сверка <b id="nav-rec"></b></a>
      <a href="#/money" data-view="money">Деньги</a>
      <a href="#/tasks" data-view="tasks">Действия <b id="nav-tasks"></b></a>
    </nav>
  </div>
</header>
<main id="main" class="wrap">
  <div class="chips"><span class="chip" id="demo-strip"></span><span class="chip live" id="mode-badge" hidden></span><span id="crumbs" hidden></span></div>
  <section id="view" tabindex="-1"></section>
</main>
<footer class="wrap foot"><span>Оплата вовремя</span></footer>

<aside class="drawer" id="drawer" aria-label="Карточка счёта" hidden></aside>
<div class="scrim" id="scrim" hidden></div>

<dialog id="dlg"><div id="dlg-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="web/vendor/qrcode.js"></script>
<script type="module" src="web/js/app.js"></script>
</body>
</html>
